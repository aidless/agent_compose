[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-compose"
version = "0.1.0"
description = "Benchmarking compositional generalization in LLM tool use"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anonymous", email = "anonymous@example.com"},
]
keywords = ["llm", "agent", "tool-use", "compositional-generalization", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
llm = [
    # Only required for the optional DeepSeek-V4-Flash validation runs
    # (scripts/evaluate_llm.py). Not pulled in by `pip install -e .`.
    # No SDK required — we use the OpenAI-compatible REST endpoint via `requests`.
]
all = ["agent-compose[dev]"]

[project.urls]
Homepage = "TBD (anonymized for double-blind submission)"
Paper = "TBD"

[project.scripts]
agent-compose-generate = "agent_compose.scripts.generate:main"
agent-compose-eval = "agent_compose.scripts.evaluate:main"
agent-compose-analyze = "agent_compose.scripts.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
