name: Offline tests

# This workflow does not call a model API and does not read API keys.
# Live runs are scripts/evaluate_llm.py. They are not a CI gate and they
# are not evidence that the committed score files match a fresh execution.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: offline pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no 3.9 build for ubuntu-26.04 (ubuntu-latest); pin the
          # oldest supported interpreter to an image that still ships it.
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline pytest
        run: |
          python -m pytest -v --tb=short
